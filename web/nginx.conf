server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API calls: the browser never needs CORS in the containerised setup.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # History-mode routing: unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
