name: Deploy browser demo to AWS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web-angular/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:demo
        working-directory: web
      - run: npm ci
        working-directory: web-angular
      - run: npm run build:demo -- --base-href /angular/
        working-directory: web-angular
      - run: mkdir -p web/dist/angular && cp -r web-angular/dist/salarynet/browser/. web/dist/angular/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1
      - run: aws s3 sync web/dist "s3://${{ vars.AWS_DEMO_BUCKET }}" --delete
      - run: aws cloudfront create-invalidation --distribution-id "${{ vars.AWS_DEMO_DISTRIBUTION_ID }}" --paths '/*'
